name: Deploy

# 只在有人决定上线时跑：推 main、推 tag 都不部署（推 main 只会由 tag.yml 自动打一个版本号 tag）。
# 上线：Actions → Deploy → Run workflow，在 Use workflow from 里选要上线的 tag；或本地 node scripts/release.mjs deploy [版本号]
# （npm 仓库是 npm run deploy -- [版本号]）。回滚同样选上一个 tag。规则见 scripts/release.mjs 开头。
#
# data-service 容器化部署（与本地 IDE 隔离）：
#   • 两个 Spring Boot 应用（gateway / data-server）打成镜像，跑在基础设施所在的
#     docker 网络 data-service-infra_default 上，用服务名互访（gateway 经 Nacos 发现 data-server）。
#   • 配置走 Nacos 的独立命名空间 data-service-prod（地址用服务名：mysql/redis/rabbitmq/nacos/
#     minio/elasticsearch；sandbox 用 host.docker.internal:8088）。本地 IDE 仍用 fe9e39ae 命名空间
#     （localhost），两套互不影响。
#   • 基础设施（Nacos/MySQL/...）由 docker/docker-compose.yml 常驻；这里幂等确保其在线。
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一仓库的部署排队、不互相取消：上线是有意为之的，一次部署跑到一半（旧容器已删、新容器还没起）
# 被取消，线上就挂了。
concurrency:
  group: deploy-data-service
  cancel-in-progress: false

env:
  NET: data-service-infra_default
  NACOS_NS: data-service-prod
  # data-server 的管理端口（健康检查），见 modules/data-server/src/main/resources/application.yml
  DS_MGMT_PORT: "8021"
  # 在 Docker 网络里发探活请求用的 curl 镜像，固定版本
  CURL_IMAGE: curlimages/curl:8.10.1

jobs:
  deploy:
    # 跑在本机（Mac）上的自托管 Runner，与其它仓库共用同一台机器
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 只部署 v* 版本 tag，而且 tag 指向的提交必须已经在 main 上：线上永远是 main 上某个有版本号的提交。
      # Use workflow from 里选的是分支就直接失败；回滚就是再选上一个 tag 跑一次。
      - name: Only release tags on main
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::只部署 v* 版本 tag（现在是 $GITHUB_REF）。手动触发请在 Use workflow from 里选一个 tag。"; exit 1 ;;
          esac
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME 指向的提交不在 main 上，不部署：先合进 main 再上线"; exit 1; }
          echo "部署 $GITHUB_REF_NAME（$GITHUB_SHA）"

      # JDK 17 + Maven 来自宿主（deploy.sh 已装）。launchd 后台会话 PATH 较干净，显式补上
      # Homebrew 路径，并把 JAVA_HOME 固定到 17。
      - name: Resolve toolchain
        run: |
          echo "/opt/homebrew/bin:/usr/local/bin" >> "$GITHUB_PATH"
          JH="$(/usr/libexec/java_home -v 17)"
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "$JH/bin" >> "$GITHUB_PATH"

      # macOS 自托管 Runner 跑在 launchd 后台会话里，默认 ~/.docker/config.json 的
      # credsStore=desktop 会去访问登录钥匙串；无人交互时报 "keychain cannot be accessed"，
      # 连 docker build/pull 公共基础镜像都会失败。指向一个干净的 DOCKER_CONFIG（config.json={}，
      # 无 credsStore），让后续 docker 命令都不走钥匙串助手——公共镜像匿名拉取即可。
      - name: Prepare clean docker config (bypass macOS keychain)
        run: |
          DC="$RUNNER_TEMP/docker-ci"
          mkdir -p "$DC"
          printf '{}' > "$DC/config.json"
          echo "DOCKER_CONFIG=$DC" >> "$GITHUB_ENV"

      - name: Build (mvn clean install -DskipTests)
        run: mvn -B -DskipTests clean install

      # 基础设施（Nacos/MySQL/...）由宿主 docker/docker-compose.yml 常驻，这里只校验其网络在线
      # （不用 docker compose——本机 docker CLI 未装 compose v2 插件）。不在则提示先跑 ./deploy.sh infra。
      - name: Ensure infra network exists
        run: |
          docker network inspect "$NET" >/dev/null 2>&1 \
            || { echo "::error::基础设施网络 $NET 不存在，请先在宿主跑 ./deploy.sh infra 起 Nacos/MySQL 等"; exit 1; }

      - name: Build app images
        run: |
          set -euo pipefail
          pick_jar() {
            ls "$1"/*.jar 2>/dev/null \
              | grep -vE '\.original$|-sources\.jar$|-javadoc\.jar$' | head -1
          }
          GATEWAY_JAR="$(pick_jar gateway/target)"
          DS_JAR="$(pick_jar modules/data-server/target)"
          [ -n "$GATEWAY_JAR" ] || { echo "找不到 gateway jar"; exit 1; }
          [ -n "$DS_JAR" ] || { echo "找不到 data-server jar"; exit 1; }
          echo "gateway jar : $GATEWAY_JAR"
          echo "data-server : $DS_JAR"
          docker build -f docker/Dockerfile.app --build-arg JAR="$GATEWAY_JAR" -t ds-gateway:latest .
          docker build -f docker/Dockerfile.app --build-arg JAR="$DS_JAR"      -t ds-data-server:latest .

      # 重建两个应用容器。接入基础设施网络，用服务名互访；Nacos 指向 prod 命名空间。
      # --add-host 让 data-server 能经 host.docker.internal:8088 回连 sandbox 宿主进程。
      # data-server 先起（gateway 经发现依赖它）。gateway 容器内仍听 10011，但对外发布到宿主
      # 20011——10011 留给你本地 IDE 调试用（部署版与本地隔离）。生产验证走 http://<host>:20011/data。
      # 内存：仓库变量 DS_DATA_SERVER_MEMORY / DS_GATEWAY_MEMORY（例如 2304m）配了才加容器上限，堆按上限的 70% 给，
      # 并关掉 swap；没配时只加 ExitOnOutOfMemoryError（堆耗尽就退出、由 --restart 拉起，而不是半死不活地接着处理请求）。
      # 数值怎么定，见 docs/config-changes/2026-10-04-p0-hardening.md 第 5 节。
      - name: Redeploy containers
        env:
          DS_DATA_SERVER_MEMORY: ${{ vars.DS_DATA_SERVER_MEMORY }}
          DS_GATEWAY_MEMORY: ${{ vars.DS_GATEWAY_MEMORY }}
        run: |
          set -euo pipefail
          # 两个数组都至少有一个元素：macOS 自带的 bash 3.2 在 set -u 下展开空数组会报错。
          if [ -n "${DS_DATA_SERVER_MEMORY:-}" ]; then
            ds_mem=(--memory "$DS_DATA_SERVER_MEMORY" --memory-swap "$DS_DATA_SERVER_MEMORY" \
                    -e "JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError")
          else
            ds_mem=(-e "JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError")
          fi
          if [ -n "${DS_GATEWAY_MEMORY:-}" ]; then
            gw_mem=(--memory "$DS_GATEWAY_MEMORY" --memory-swap "$DS_GATEWAY_MEMORY" \
                    -e "JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError")
          else
            gw_mem=(-e "JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError")
          fi
          docker rm -f ds-data-server ds-gateway 2>/dev/null || true
          docker run -d --name ds-data-server --restart unless-stopped \
            "${ds_mem[@]}" \
            --network "$NET" \
            --add-host host.docker.internal:host-gateway \
            -e NACOS_SERVER_ADDR=nacos:8848 \
            -e NACOS_NAMESPACE="$NACOS_NS" \
            ds-data-server:latest
          docker run -d --name ds-gateway --restart unless-stopped \
            "${gw_mem[@]}" \
            --network "$NET" \
            --add-host host.docker.internal:host-gateway \
            -e NACOS_SERVER_ADDR=nacos:8848 \
            -e NACOS_NAMESPACE="$NACOS_NS" \
            -p 20011:10011 \
            ds-gateway:latest

      # 判定标准：data-server 自己报告就绪（应用启动完成、数据库和 Redis 都连得上），并且网关在验签。
      # 任何一项不满足，部署就判失败：宁可红，也不能把一个没起来的版本记成上线（发版脚本只在成功时写上线记录）。
      # data-server 的管理端口只在 Docker 网络里，所以探活请求从同一个网络里的 curl 容器发出。
      - name: Readiness check
        run: |
          set -euo pipefail
          if ! CURL="docker run --rm --network $NET $CURL_IMAGE" \
               bash scripts/wait-ready.sh "http://ds-data-server:${DS_MGMT_PORT}/actuator/health/readiness" 180; then
            echo "::error::data-server 180s 内没有就绪，部署判失败"
            echo "----- ds-data-server -----"; docker logs --tail 120 ds-data-server 2>&1 || true
            exit 1
          fi
          code="$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:20011/data/admin/auth/me)" || code="000"
          if [ "$code" != "401" ]; then
            echo "::error::网关没有按预期拒绝未登录请求（期望 HTTP 401，实际 ${code}）"
            echo "----- ds-gateway -----"; docker logs --tail 120 ds-gateway 2>&1 || true
            exit 1
          fi
          echo "网关正常：未登录请求被拒（HTTP 401）"

      # 每次部署都留一份各容器的内存占用，用来定 DS_*_MEMORY 的值（变更文档第 5 节）。只记录，不判失败。
      - name: Memory snapshot
        if: always()
        continue-on-error: true
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}'

      - name: Cleanup old images
        if: always()
        continue-on-error: true
        run: docker image prune -f
